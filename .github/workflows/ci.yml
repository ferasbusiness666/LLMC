name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The build the user actually runs: a native Windows GUI binary.
  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Upload llmc.exe
        uses: actions/upload-artifact@v4
        with:
          name: llmc-windows
          path: target/release/llmc.exe
          if-no-files-found: error

  # Headless verification on Linux: the pure-logic library (simulator, undo, chips, AI command
  # handling) plus the GUI crate's own tests (document model, canvas geometry, glyphs).
  linux-tests:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test library + simulation
        run: cargo test --lib --test simulation
      - name: Test GUI crate
        run: cargo test --bin llmc
