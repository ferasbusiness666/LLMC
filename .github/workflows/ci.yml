name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The build the user actually runs: a native Windows GUI binary.
  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Upload llmc.exe
        uses: actions/upload-artifact@v4
        with:
          name: llmc-windows
          path: target/release/llmc.exe
          if-no-files-found: error

  # Fast headless verification of the pure-logic engine (no GUI system deps needed).
  linux-logic:
    name: Linux logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test library + simulation
        run: cargo test --lib --test simulation
